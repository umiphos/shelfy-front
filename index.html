<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Shelfy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #fafafa; color: #1a1a1a; }

    /* Header del negocio */
    .business-header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 1.5rem;
      text-align: center;
    }
    .business-name { font-size: 1.6rem; font-weight: 700; }
    .business-desc { color: #666; margin-top: 0.25rem; font-size: 0.95rem; }
    .business-wa {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: #22c55e;
      color: white;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .business-wa:hover { background: #16a34a; }

    /* Filtros */
    .filters {
      max-width: 900px;
      margin: 1.25rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 0.82rem;
      color: #555;
    }
    .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .filter-available {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: #555;
      cursor: pointer;
    }

    /* Products */
    main { max-width: 900px; margin: 1.25rem auto; padding: 0 1rem 2rem; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }
    .product-card {
      background: white;
      border-radius: 10px;
      border: 1px solid #eee;
      overflow: hidden;
    }
    .product-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 0.8rem;
    }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-body { padding: 0.9rem; }
    .product-name { font-weight: 600; font-size: 0.95rem; }
    .product-desc { font-size: 0.82rem; color: #777; margin-top: 0.2rem; }
    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }
    .product-price { font-size: 1.15rem; font-weight: 700; color: #2563eb; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-available { background: #dcfce7; color: #16a34a; }
    .badge-unavailable { background: #fee2e2; color: #dc2626; }

    /* Empty / error */
    .message {
      text-align: center;
      padding: 3rem 1rem;
      color: #888;
      grid-column: 1 / -1;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.78rem;
      color: #aaa;
      border-top: 1px solid #eee;
      margin-top: 2rem;
    }
    footer a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>

<div class="business-header">
  <div class="business-name" id="biz-name">Cargando...</div>
  <div class="business-desc" id="biz-desc"></div>
  <div id="biz-wa"></div>
</div>

<div class="filters" id="filters" style="display:none">
  <button class="filter-btn active" data-cat="" onclick="filterCategory(this, '')">Todos</button>
  <label class="filter-available">
    <input type="checkbox" id="chk-available" onchange="filterCategory(null, currentCategory)" />
    Solo disponibles
  </label>
</div>

<main>
  <div class="products-grid" id="products-grid">
    <div class="message">Cargando catálogo...</div>
  </div>
</main>

<footer>
  Potenciado por <a href="login.html">Shelfy</a> — catálogos para negocios locales
</footer>

<script src="api.js"></script>
<script>
  // El slug viene de la URL: /index.html?slug=tacos-mary
  // O directamente: /tacos-mary (requiere server config)
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug") || window.location.pathname.split("/").filter(Boolean).pop();

  let currentCategory = "";
  let allProducts = [];
  let categories = [];

  async function init() {
    if (!slug || slug === "index.html") {
      document.getElementById("biz-name").textContent = "Catálogo no encontrado";
      document.getElementById("products-grid").innerHTML =
        `<div class="message">Usa ?slug=nombre-del-negocio en la URL</div>`;
      return;
    }

    try {
      const [biz, products] = await Promise.all([
        getCatalog(slug),
        getCatalogProducts(slug),
      ]);

      // Header del negocio
      document.title = `${biz.name} — Shelfy`;
      document.getElementById("biz-name").textContent = biz.name;
      document.getElementById("biz-desc").textContent = biz.description || "";
      if (biz.whatsapp_number) {
        const num = biz.whatsapp_number.replace(/\D/g, "");
        document.getElementById("biz-wa").innerHTML =
          `<a class="business-wa" href="https://wa.me/${num}" target="_blank">
            📱 Pedir por WhatsApp
          </a>`;
      }

      allProducts = products;

      // Categorías únicas
      categories = [...new Set(products.map(p => p.category).filter(Boolean))];
      if (categories.length > 1) {
        const filters = document.getElementById("filters");
        filters.style.display = "flex";
        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.textContent = cat;
          btn.dataset.cat = cat;
          btn.onclick = () => filterCategory(btn, cat);
          filters.insertBefore(btn, filters.querySelector(".filter-available"));
        });
      }

      renderProducts(products);
    } catch (e) {
      document.getElementById("biz-name").textContent = "Negocio no encontrado";
      document.getElementById("products-grid").innerHTML =
        `<div class="message">Este catálogo no existe o no está disponible.</div>`;
    }
  }

  function filterCategory(btn, cat) {
    currentCategory = cat;
    if (btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
    const availableOnly = document.getElementById("chk-available").checked;
    let filtered = allProducts;
    if (cat) filtered = filtered.filter(p => p.category === cat);
    if (availableOnly) filtered = filtered.filter(p => p.available);
    renderProducts(filtered);
  }

  function renderProducts(products) {
    const grid = document.getElementById("products-grid");
    if (!products.length) {
      grid.innerHTML = `<div class="message">Sin productos en esta categoría.</div>`;
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-img">
          ${p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}" onerror="this.parentElement.textContent='Sin imagen'" />`
            : "Sin imagen"}
        </div>
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          ${p.description ? `<div class="product-desc">${p.description}</div>` : ""}
          <div class="product-footer">
            <span class="product-price">$${parseFloat(p.price).toFixed(2)}</span>
            <span class="badge ${p.available ? "badge-available" : "badge-unavailable"}">
              ${p.available ? "Disponible" : "Agotado"}
            </span>
          </div>
        </div>
      </div>
    `).join("");
  }

  init();
</script>
</body>
</html>
