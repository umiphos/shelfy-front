<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Catálogo — Shelfy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }

    /* Nav */
    nav {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .nav-brand { font-weight: 700; font-size: 1.1rem; color: #2563eb; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-slug { font-size: 0.85rem; color: #666; }
    .nav-slug a { color: #2563eb; text-decoration: none; }
    .btn-logout {
      padding: 0.4rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
    }
    .btn-logout:hover { background: #f5f5f5; }

    /* Layout */
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.3rem; }

    /* Botón primario */
    .btn-primary {
      padding: 0.55rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-primary:hover { background: #1d4ed8; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      width: 100%;
      max-width: 460px;
      margin: 1rem;
    }
    .modal h3 { margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 0.3rem; color: #444; }
    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; }
    textarea { resize: vertical; min-height: 70px; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1rem; }
    .btn-cancel {
      padding: 0.5rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Products grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .product-card {
      background: white;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #eee;
    }
    .product-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .product-name { font-weight: 600; font-size: 0.95rem; }
    .product-category { font-size: 0.75rem; color: #888; margin-top: 0.1rem; }
    .product-price { font-size: 1.1rem; font-weight: 700; color: #2563eb; margin: 0.5rem 0; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-available { background: #dcfce7; color: #16a34a; }
    .badge-unavailable { background: #fee2e2; color: #dc2626; }
    .product-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .btn-sm {
      padding: 0.35rem 0.7rem;
      border-radius: 5px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-sm:hover { background: #f5f5f5; }
    .btn-sm.danger { color: #dc2626; border-color: #fca5a5; }
    .btn-sm.danger:hover { background: #fef2f2; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: #888;
    }
    .empty p { margin-top: 0.5rem; font-size: 0.9rem; }

    /* Error */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #dc2626;
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Shelfy</span>
  <div class="nav-right">
    <span class="nav-slug" id="nav-slug"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <h2>Mis productos</h2>
    <button class="btn-primary" onclick="openModal()">+ Agregar producto</button>
  </div>

  <div class="products-grid" id="products-grid">
    <div class="empty">Cargando...</div>
  </div>
</main>

<!-- Modal agregar/editar -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Agregar producto</h3>
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" id="f-name" required placeholder="Taco de canasta" />
    </div>
    <div class="form-group">
      <label>Precio *</label>
      <input type="number" id="f-price" required min="0.01" step="0.01" placeholder="15.00" />
    </div>
    <div class="form-group">
      <label>Categoría</label>
      <input type="text" id="f-category" placeholder="tacos, bebidas, postres..." />
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea id="f-description" placeholder="Descripción opcional..."></textarea>
    </div>
    <div class="form-group">
      <label>URL de imagen</label>
      <input type="url" id="f-image" placeholder="https://..." />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveProduct()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = "login.html";

  let editingId = null;
  let currentSlug = null;

  async function init() {
    try {
      const products = await getMyProducts();
      // Obtener slug del primer producto o del perfil
      // Por ahora lo extraemos del token (payload)
      const token = getToken();
      const payload = JSON.parse(atob(token.split(".")[1]));
      // El slug lo cargamos desde el catálogo — hacemos un call al health y usamos el business
      renderProducts(products);
    } catch (e) {
      showToast(e.message);
    }
  }

  function renderProducts(products) {
    const grid = document.getElementById("products-grid");
    if (!products.length) {
      grid.innerHTML = `<div class="empty">
        <strong>Sin productos aún</strong>
        <p>Agrega tu primer producto con el botón de arriba.</p>
      </div>`;
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-card-header">
          <div>
            <div class="product-name">${p.name}</div>
            <div class="product-category">${p.category || "Sin categoría"}</div>
          </div>
          <span class="badge ${p.available ? "badge-available" : "badge-unavailable"}">
            ${p.available ? "Disponible" : "Agotado"}
          </span>
        </div>
        <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
        ${p.description ? `<div style="font-size:0.82rem;color:#666">${p.description}</div>` : ""}
        <div class="product-actions">
          <button class="btn-sm" onclick="editProduct(${p.id}, ${JSON.stringify(p).replace(/"/g, '&quot;')})">Editar</button>
          <button class="btn-sm" onclick="handleToggle(${p.id})">
            ${p.available ? "Marcar agotado" : "Marcar disponible"}
          </button>
          <button class="btn-sm danger" onclick="handleDelete(${p.id})">Eliminar</button>
        </div>
      </div>
    `).join("");
  }

  function openModal(title = "Agregar producto") {
    editingId = null;
    document.getElementById("modal-title").textContent = title;
    ["f-name", "f-price", "f-category", "f-description", "f-image"].forEach(id => {
      document.getElementById(id).value = "";
    });
    document.getElementById("modal").classList.add("open");
  }

  function editProduct(id, product) {
    editingId = id;
    document.getElementById("modal-title").textContent = "Editar producto";
    document.getElementById("f-name").value = product.name || "";
    document.getElementById("f-price").value = product.price || "";
    document.getElementById("f-category").value = product.category || "";
    document.getElementById("f-description").value = product.description || "";
    document.getElementById("f-image").value = product.image_url || "";
    document.getElementById("modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
  }

  async function saveProduct() {
    const payload = {
      name: document.getElementById("f-name").value,
      price: parseFloat(document.getElementById("f-price").value),
      category: document.getElementById("f-category").value || null,
      description: document.getElementById("f-description").value || null,
      image_url: document.getElementById("f-image").value || null,
    };
    try {
      if (editingId) {
        await updateProduct(editingId, payload);
      } else {
        await createProduct(payload);
      }
      closeModal();
      init();
    } catch (e) {
      showToast(e.message);
    }
  }

  async function handleToggle(id) {
    try {
      await toggleProduct(id);
      init();
    } catch (e) {
      showToast(e.message);
    }
  }

  async function handleDelete(id) {
    if (!confirm("¿Eliminar este producto?")) return;
    try {
      await deleteProduct(id);
      init();
    } catch (e) {
      showToast(e.message);
    }
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 3500);
  }

  init();
</script>
</body>
</html>
