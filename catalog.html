<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — PrecioInbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header del negocio ── */
    .business-header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    .business-logo {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin: 0 auto 0.75rem; color: white;
      font-weight: 700;
    }
    .business-name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .business-desc { color: #666; margin-top: 0.35rem; font-size: 0.9rem; max-width: 400px; margin-inline: auto; }
    .business-wa {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin-top: 1rem; padding: 0.55rem 1.1rem; background: #22c55e;
      color: white; border-radius: 999px; text-decoration: none;
      font-size: 0.85rem; font-weight: 600; transition: background 0.2s;
    }
    .business-wa:hover { background: #16a34a; }

    /* ── Barra de búsqueda y filtros ── */
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      background: white; border-bottom: 1px solid #e5e5e5;
      padding: 0.75rem 1rem;
    }
    .toolbar-inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.6rem; }

    .search-wrap { position: relative; }
    .search-icon {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      color: #aaa; font-size: 0.9rem; pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 0.55rem 0.75rem 0.55rem 2.2rem;
      border: 1px solid #e5e5e5; border-radius: 8px;
      font-size: 0.9rem; background: #f5f5f7; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input:focus { border-color: #2563eb; background: white; }

    .filters-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

    .filter-btn {
      padding: 0.3rem 0.8rem; border-radius: 999px; border: 1.5px solid #e5e5e5;
      background: white; cursor: pointer; font-size: 0.8rem; font-weight: 500;
      color: #555; transition: all 0.15s; white-space: nowrap;
    }
    .filter-btn:hover { border-color: #2563eb; color: #2563eb; }
    .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

    .filter-available {
      margin-left: auto; display: flex; align-items: center;
      gap: 0.4rem; font-size: 0.8rem; font-weight: 500; color: #555;
      cursor: pointer; white-space: nowrap;
    }
    .filter-available input { accent-color: #2563eb; width: 15px; height: 15px; cursor: pointer; }

    .results-count {
      font-size: 0.75rem; color: #999; padding: 0 0.25rem;
    }

    /* ── Contenido principal ── */
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    /* ── Sección por categoría ── */
    .category-section { margin-bottom: 2.5rem; }
    .category-header {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .category-title {
      font-size: 1rem; font-weight: 700; color: #1a1a1a;
      text-transform: capitalize;
    }
    .category-count {
      font-size: 0.75rem; color: #999; font-weight: 500;
      background: #f0f0f0; padding: 0.15rem 0.5rem; border-radius: 999px;
    }
    .category-line { flex: 1; height: 1px; background: #e5e5e5; }

    /* ── Grid de productos ── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
    }

    /* ── Tarjeta de producto ── */
    .product-card {
      background: white; border-radius: 12px; border: 1px solid #e5e5e5;
      overflow: hidden; transition: box-shadow 0.2s, transform 0.2s;
      cursor: default;
    }
    .product-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .product-card.unavailable { opacity: 0.65; }

    .product-img-wrap {
      width: 100%; height: 150px; overflow: hidden;
      background: #f5f5f7; position: relative;
    }
    .product-img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.04); }

    .product-img-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 0.35rem;
      color: #ccc;
    }
    .product-img-placeholder span { font-size: 2rem; }
    .product-img-placeholder small { font-size: 0.7rem; color: #ddd; }

    .unavailable-overlay {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
    }
    .unavailable-tag {
      background: #ef4444; color: white; font-size: 0.7rem;
      font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 4px;
      letter-spacing: 0.05em; text-transform: uppercase;
    }

    .product-body { padding: 0.75rem; }
    .product-name { font-weight: 600; font-size: 0.88rem; line-height: 1.3; }
    .product-desc {
      font-size: 0.75rem; color: #888; margin-top: 0.2rem;
      line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 0.6rem;
    }
    .product-price { font-size: 1.05rem; font-weight: 700; color: #2563eb; }
    .badge-available {
      font-size: 0.65rem; font-weight: 600; color: #16a34a;
      background: #dcfce7; padding: 0.15rem 0.45rem; border-radius: 999px;
    }

    /* ── Estado vacío ── */
    .empty-state {
      text-align: center; padding: 4rem 1rem; color: #aaa;
      grid-column: 1 / -1;
    }
    .empty-state span { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.9rem; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 1.5rem;
      font-size: 0.75rem; color: #bbb;
      border-top: 1px solid #e5e5e5;
    }
    footer a { color: #2563eb; text-decoration: none; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      .product-img-wrap { height: 120px; }
      .filter-available span { display: none; }
    }
  </style>
</head>
<body>

<!-- Header del negocio -->
<div class="business-header">
  <div class="business-logo" id="biz-logo"></div>
  <div class="business-name" id="biz-name">Cargando...</div>
  <div class="business-desc" id="biz-desc"></div>
  <div id="biz-wa"></div>
</div>

<!-- Barra de búsqueda y filtros -->
<div class="toolbar" id="toolbar" style="display:none">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="Buscar productos..."
        oninput="applyFilters()"
      />
    </div>
    <div class="filters-row">
      <button class="filter-btn active" data-cat="" onclick="selectCategory(this)">Todos</button>
      <div id="category-filters"></div>
      <label class="filter-available">
        <input type="checkbox" id="chk-available" onchange="applyFilters()" />
        <span>Solo disponibles</span>
      </label>
    </div>
    <div class="results-count" id="results-count"></div>
  </div>
</div>

<!-- Productos -->
<main id="main-content">
  <div style="text-align:center;padding:3rem;color:#aaa">Cargando catálogo...</div>
</main>

<footer>
  Potenciado por <a href="https://www.precioinbox.com">PrecioInbox</a> — catálogos para negocios locales
</footer>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  let allProducts = [];
  let currentCategory = "";

  async function init() {
    if (!slug) { window.location.href = "index.html"; return; }

    try {
      const [biz, products] = await Promise.all([
        getCatalog(slug),
        getCatalogProducts(slug),
      ]);

      // Header
      document.title = `${biz.name} — PrecioInbox`;
      const initials = biz.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
      document.getElementById("biz-logo").textContent = initials;
      document.getElementById("biz-name").textContent = biz.name;
      document.getElementById("biz-desc").textContent = biz.description || "";

      if (biz.whatsapp_number) {
        const num = biz.whatsapp_number.replace(/\D/g, "");
        document.getElementById("biz-wa").innerHTML =
          `<a class="business-wa" href="https://wa.me/${num}" target="_blank">📱 Pedir por WhatsApp</a>`;
      }

      allProducts = products;

      // Construir filtros de categorías
      const categories = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
      if (categories.length > 0) {
        const container = document.getElementById("category-filters");
        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.textContent = cat;
          btn.dataset.cat = cat;
          btn.onclick = () => selectCategory(btn);
          container.appendChild(btn);
        });
        document.getElementById("toolbar").style.display = "block";
      } else if (products.length > 0) {
        document.getElementById("toolbar").style.display = "block";
      }

      renderCatalog(products);
    } catch (e) {
      document.getElementById("biz-name").textContent = "Catálogo no encontrado";
      document.getElementById("main-content").innerHTML =
        `<div style="text-align:center;padding:3rem;color:#aaa">
          <span style="font-size:2rem">😕</span>
          <p>Este catálogo no existe o no está disponible.</p>
        </div>`;
    }
  }

  function selectCategory(btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.dataset.cat;
    applyFilters();
  }

  function applyFilters() {
    const search = document.getElementById("search-input").value.toLowerCase().trim();
    const availableOnly = document.getElementById("chk-available").checked;

    let filtered = allProducts;
    if (currentCategory) filtered = filtered.filter(p => p.category === currentCategory);
    if (availableOnly) filtered = filtered.filter(p => p.available);
    if (search) filtered = filtered.filter(p =>
      p.name.toLowerCase().includes(search) ||
      (p.description || "").toLowerCase().includes(search)
    );

    const count = filtered.length;
    document.getElementById("results-count").textContent =
      count === allProducts.length ? "" : `${count} resultado${count !== 1 ? "s" : ""}`;

    renderCatalog(filtered);
  }

  function renderCatalog(products) {
    const main = document.getElementById("main-content");

    if (!products.length) {
      main.innerHTML = `
        <div class="empty-state">
          <span>🔍</span>
          <p>Sin productos que coincidan con tu búsqueda.</p>
        </div>`;
      return;
    }

    // Agrupar por categoría
    const grouped = {};
    const sinCategoria = [];

    products.forEach(p => {
      if (p.category) {
        if (!grouped[p.category]) grouped[p.category] = [];
        grouped[p.category].push(p);
      } else {
        sinCategoria.push(p);
      }
    });

    // Si hay una sola categoría activa o búsqueda, mostrar flat sin headers
    const categorias = Object.keys(grouped);
    const usarFlat = currentCategory || categorias.length === 0;

    if (usarFlat) {
      main.innerHTML = `<div class="products-grid">${products.map(productCard).join("")}</div>`;
      return;
    }

    // Mostrar agrupado
    let html = "";

    // Primero categorías
    categorias.sort().forEach(cat => {
      const items = grouped[cat];
      html += `
        <div class="category-section">
          <div class="category-header">
            <span class="category-title">${cat}</span>
            <span class="category-count">${items.length}</span>
            <div class="category-line"></div>
          </div>
          <div class="products-grid">${items.map(productCard).join("")}</div>
        </div>`;
    });

    // Al final, productos sin categoría
    if (sinCategoria.length) {
      html += `
        <div class="category-section">
          <div class="category-header">
            <span class="category-title">Otros</span>
            <span class="category-count">${sinCategoria.length}</span>
            <div class="category-line"></div>
          </div>
          <div class="products-grid">${sinCategoria.map(productCard).join("")}</div>
        </div>`;
    }

    main.innerHTML = html;
  }

  function productCard(p) {
    const imgHtml = p.image_url
      ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy"
           onerror="this.parentElement.innerHTML='<div class=\\'product-img-placeholder\\'><span>📦</span><small>Sin imagen</small></div>'" />`
      : `<div class="product-img-placeholder"><span>📦</span><small>Sin imagen</small></div>`;

    const unavailableOverlay = !p.available
      ? `<div class="unavailable-overlay"><span class="unavailable-tag">Agotado</span></div>`
      : "";

    return `
      <div class="product-card ${!p.available ? "unavailable" : ""}">
        <div class="product-img-wrap">
          ${imgHtml}
          ${unavailableOverlay}
        </div>
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          ${p.description ? `<div class="product-desc">${p.description}</div>` : ""}
          <div class="product-footer">
            <span class="product-price">$${parseFloat(p.price).toFixed(2)}</span>
            ${p.available ? `<span class="badge-available">✓ Disponible</span>` : ""}
          </div>
        </div>
      </div>`;
  }

  init();
</script>
</body>
</html>
